services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Free temporal compartido por usuarios, órdenes e inventario.
  # Render permite una sola BD Free activa en este workspace.
  # MongoDB Atlas y RabbitMQ CloudAMQP siguen siendo proveedores externos.
  #
  # Las URLs entre servicios usan directamente el hostname publico de Render.
  # ---------------------------------------------------------------------------
  - type: web
    name: neon-ms-usuarios
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./ms-usuarios
    dockerfilePath: ./ms-usuarios/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neon-config
      - key: DATABASE_URL
        fromDatabase:
          name: neon-usuarios-db
          property: connectionString

  - type: web
    name: neon-ms-activos
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./ms-activos
    dockerfilePath: ./ms-activos/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neon-config
      - key: MONGODB_URI
        sync: false

  - type: web
    name: neon-ms-ordenes
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./ms-ordenes
    dockerfilePath: ./ms-ordenes/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neon-config
      - key: DATABASE_URL
        fromDatabase:
          name: neon-usuarios-db
          property: connectionString
      - key: RABBITMQ_URL
        fromService:
          name: neon-ms-notificaciones
          type: web
          envVarKey: RABBITMQ_URL
      - key: ACTIVOS_SERVICE_URL
        fromService:
          name: neon-ms-activos
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: INVENTARIO_SERVICE_URL
        fromService:
          name: neon-ms-inventario
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: USUARIOS_SERVICE_URL
        fromService:
          name: neon-ms-usuarios
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: neon-ms-inventario
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./ms-inventario
    dockerfilePath: ./ms-inventario/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neon-config
      - key: DATABASE_URL
        fromDatabase:
          name: neon-usuarios-db
          property: connectionString

  - type: web
    name: neon-ms-notificaciones
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./ms-notificaciones
    dockerfilePath: ./ms-notificaciones/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neon-config
      - key: RABBITMQ_URL
        sync: false

  # ---------------------------------------------------------------------------
  # API Gateway: punto unico de entrada publico.
  # ---------------------------------------------------------------------------
  - type: web
    name: neon-api-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./api-gateway
    dockerfilePath: ./api-gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neon-config
      - key: USERS_SERVICE_URL
        fromService:
          name: neon-ms-usuarios
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ACTIVOS_SERVICE_URL
        fromService:
          name: neon-ms-activos
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ORDENES_SERVICE_URL
        fromService:
          name: neon-ms-ordenes
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: INVENTARIO_SERVICE_URL
        fromService:
          name: neon-ms-inventario
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: NOTIFICACIONES_SERVICE_URL
        fromService:
          name: neon-ms-notificaciones
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  # ---------------------------------------------------------------------------
  # Frontend: sitio estatico (Vite + React). La URL del Gateway se hornea en
  # build-time con VITE_API_URL.
  # ---------------------------------------------------------------------------
  - type: web
    name: neon-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: neon-api-gateway
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Plan gratuito temporal: Render Postgres Free expira 30 días después de crearse.
  - name: neon-usuarios-db
    databaseName: usuarios
    user: neon_usuarios
    plan: free
    region: oregon

envVarGroups:
  - name: neon-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: neon
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_ROUNDS
        value: '10'
      - key: PGSSLMODE
        value: require
      - key: RABBITMQ_EXCHANGE
        value: neon_events
      - key: RABBITMQ_EXCHANGE_TYPE
        value: topic
      - key: NOTIF_QUEUE
        value: neon_notificaciones_queue
      - key: CORS_ORIGIN
        value: '*'
      - key: PROXY_TIMEOUT_MS
        value: '60000'
      - key: SEED_ADMIN_EMAIL
        value: admin@neon.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NOMBRE
        value: Administrador NEON
