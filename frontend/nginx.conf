# =============================================================================
# NEON :: frontend - Nginx para la SPA
# =============================================================================
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fallback de SPA: cualquier ruta desconocida sirve index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache de assets con hash generado por Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
